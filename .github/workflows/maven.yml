name: Java CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Build with Maven
      working-directory: ./delivery-api/delivery-api
      run: mvn clean package -DskipTests

    # (opcional, se quiser pular testes)
    # - name: Run Tests
    #   working-directory: ./delivery-api/delivery-api
    #   run: mvn test

    - name: Build Docker Image
      working-directory: ./delivery-api/delivery-api
      run: docker build -t myapp:latest .


    - name: Deploy
      run: echo "Deploy automático executado"